name: Agent patch pinned source integration

on:
  push:
    branches: [agent/issues-27-28-pinned-worktrees]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-27-28-pinned-worktrees
          fetch-depth: 0
      - name: Apply focused runner integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ablator/runner.py')
          text = path.read_text()

          import_old = 'from . import provenance as provmod\nfrom . import resources\n'
          import_new = 'from . import provenance as provmod\nfrom . import resources\nfrom . import source_checkout as sourcecheckout\n'
          if import_new not in text:
              assert text.count(import_old) == 1, text.count(import_old)
              text = text.replace(import_old, import_new, 1)

          run_old = '''    try:\n        tcfg = cfgmod.type_cfg(cfg, job.get("type", ""), machine)\n        argv, env, cwd = render_command(tcfg, job, machine)\n    except (KeyError, TemplateError) as e:\n        print(f"[ablator] {job['id']} unrunnable: {e}", flush=True)\n        return "failed", None\n'''
          run_new = '''    try:\n        tcfg = cfgmod.type_cfg(cfg, job.get("type", ""), machine)\n        prepared_source = sourcecheckout.prepare_job_source(cfg, job, machine, tcfg)\n        tcfg = prepared_source.type_config\n        if prepared_source.checkout_path:\n            job = dict(job)\n            job["_prepared_repo_cwd"] = prepared_source.checkout_path\n            if q is not None:\n                q.update(\n                    job["id"],\n                    source_checkout=prepared_source.checkout_path,\n                    source_repo=prepared_source.source_repo,\n                    requested_git_sha=prepared_source.requested_git_sha,\n                )\n        argv, env, cwd = render_command(tcfg, job, machine)\n    except (KeyError, TemplateError, sourcecheckout.SourcePreparationError) as e:\n        print(f"[ablator] {job['id']} unrunnable: {e}", flush=True)\n        if q is not None and isinstance(e, sourcecheckout.SourcePreparationError):\n            q.update(job["id"], source_prepare_error=str(e))\n        return "failed", None\n'''
          if run_new not in text:
              assert text.count(run_old) == 1, text.count(run_old)
              text = text.replace(run_old, run_new, 1)

          prov_old = '''    prov_state = capture_and_record_provenance(cfg, job, machine, cwd or os.getcwd(), q)\n    check_checkout_drift(cfg, job, machine, prov_state, q)\n'''
          prov_new = '''    prov_state = capture_and_record_provenance(cfg, job, machine, cwd or os.getcwd(), q)\n    try:\n        executed_git_sha = sourcecheckout.verify_executed_provenance(job, prov_state)\n    except sourcecheckout.SourcePreparationError as e:\n        print(f"[ablator] {job['id']} source provenance rejected before launch: {e}", flush=True)\n        if q is not None:\n            q.update(job["id"], source_prepare_error=str(e))\n        return "failed", None\n    if executed_git_sha is not None and q is not None:\n        q.update(job["id"], executed_git_sha=executed_git_sha)\n    check_checkout_drift(cfg, job, machine, prov_state, q)\n'''
          if prov_new not in text:
              assert text.count(prov_old) == 1, text.count(prov_old)
              text = text.replace(prov_old, prov_new, 1)

          k8s_old = '        sha = local_commit or "HEAD"\n'
          k8s_new = '        sha = job.get("requested_git_sha") or local_commit or "HEAD"\n'
          if k8s_new not in text:
              assert text.count(k8s_old) == 1, text.count(k8s_old)
              text = text.replace(k8s_old, k8s_new, 1)

          path.write_text(text)
          PY
          python -m compileall -q src/ablator
          git diff --check
      - name: Commit runner integration
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ablator/runner.py
          git commit -m 'feat(#27,#28): execute pinned jobs from immutable worktrees'
          git push origin HEAD:agent/issues-27-28-pinned-worktrees
