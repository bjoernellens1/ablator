name: Agent retry worktree GC

on:
  push:
    branches: [agent/issue-31-worktree-gc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-31-worktree-gc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply GC integration robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/ablator/source_checkout.py')
          text = path.read_text()
          if 'import time\n' not in text:
              text = text.replace('import subprocess\n', 'import subprocess\nimport time\n', 1)
          helper = '''def cache_root(cfg: dict, machine: str) -> str:\n    """Public cache-root resolver shared by materialization and GC."""\n    return _cache_root(cfg, machine)\n'''
          if helper not in text:
              marker = '\n\ndef _repo_key(identity: str) -> str:\n'
              assert marker in text
              text = text.replace(marker, '\n\n' + helper + marker, 1)

          old = 'json.dump({"sha": sha, "repo": identity, "checkout": checkout}, handle)'
          new = '''json.dump({\n                    "sha": sha,\n                    "repo": identity,\n                    "checkout": checkout,\n                    "source_repo_path": repo,\n                    "last_used_at": time.time(),\n                }, handle)'''
          assert old in text or '"last_used_at": time.time()' in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/ablator/cli.py')
          text = path.read_text()
          if 'from . import source_gc as sourcegc\n' not in text:
              anchor = 'from . import source_display as sourcedisplay\n'
              assert anchor in text
              text = text.replace(anchor, anchor + 'from . import source_gc as sourcegc\n', 1)

          fn = '''# ------------------------------------------------------------------ git worktree cache GC\ndef cmd_gc(cfg: dict, *, dry_run: bool = False,\n           max_age_days: float | None = None) -> None:\n    machine = cfgmod.machine_name(cfg)\n    result = sourcegc.gc_worktrees(\n        cfg, machine, _queue(cfg).read(), dry_run=dry_run,\n        max_age_days=max_age_days,\n    )\n    verb = "candidate" if dry_run else "removed"\n    paths = result.candidates if dry_run else result.removed\n    for checkout in paths:\n        print(f"[gc] {verb}: {checkout}")\n    for checkout in result.protected:\n        print(f"[gc] protected (running): {checkout}")\n    for error in result.errors:\n        print(f"[gc] ERROR: {error}")\n    print(\n        f"[gc] machine={machine} dry_run={dry_run} "\n        f"candidates={len(result.candidates)} removed={len(result.removed)} "\n        f"protected={len(result.protected)} retained={len(result.retained)} "\n        f"errors={len(result.errors)}"\n    )\n    if result.errors:\n        raise SystemExit(1)\n'''
          if fn not in text:
              marker = '\n\n# ------------------------------------------------------------------ main\ndef main(argv: list[str] | None = None) -> None:\n'
              assert marker in text
              text = text.replace(marker, '\n\n' + fn + marker, 1)

          if 'sub.add_parser("gc", help="garbage-collect stale immutable Git worktrees")' not in text:
              marker = '    sub.add_parser("tui", help="launch the k9s-style TUI (guided setup on "\n'
              assert marker in text
              block = '''    sp = sub.add_parser("gc", help="garbage-collect stale immutable Git worktrees")\n    sp.add_argument("--dry-run", action="store_true",\n                    help="list stale candidates without removing them")\n    sp.add_argument("--max-age-days", type=float,\n                    help="override [git].gc_max_age_days (default 30)")\n'''
              text = text.replace(marker, block + marker, 1)

          if 'cmd_gc(cfg, dry_run=a.dry_run, max_age_days=a.max_age_days)' not in text:
              marker = '''    elif a.cmd == "unpause":\n        cmd_unpause(cfg, a.machine)\n'''
              assert marker in text
              text = text.replace(marker, marker + '''    elif a.cmd == "gc":\n        cmd_gc(cfg, dry_run=a.dry_run, max_age_days=a.max_age_days)\n''', 1)
          path.write_text(text)
          PY
          python -m compileall -q src/ablator tests
          git diff --check
      - name: Run full test suite
        run: |
          git config --global user.name "Ablator CI"
          git config --global user.email "ablator-ci@users.noreply.github.com"
          python -m pip install -e . pytest
          pytest -q
      - name: Commit GC integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ablator/source_checkout.py src/ablator/cli.py
          git commit -m 'feat(#31): add safe worktree cache garbage collection'
          git push origin HEAD:agent/issue-31-worktree-gc
