name: Agent patch source provenance UX

on:
  push:
    branches: [agent/issue-32-source-provenance-ux]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-32-source-provenance-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch CLI inspect and TUI detail
        run: |
          python - <<'PY'
          from pathlib import Path

          # CLI
          path = Path('src/ablator/cli.py')
          text = path.read_text()
          old = 'from . import runner, spec as specmod\n'
          new = 'from . import runner, spec as specmod\nfrom . import source_display as sourcedisplay\n'
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)

          old = '''        print(f"  {'':<40} scene={j['scene']}")\n'''
          new = '''        print(f"  {'':<40} scene={j['scene']}")\n        if j.get("requested_git_sha"):\n            print(f"  {'':<40} git={j['requested_git_sha']}")\n'''
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)

          old = '''    lines = [f"{'id':<40} {'lane':<4} {'status':<12} {'machine':<8} {'claimed_by':<10} "\n             f"{'elapsed':<8} {'depends_on':<12} progress"]\n'''
          new = '''    lines = [f"{'id':<40} {'lane':<4} {'status':<12} {'machine':<8} {'git':<27} {'claimed_by':<10} "\n             f"{'elapsed':<8} {'depends_on':<12} progress"]\n'''
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)

          old = '''        lines.append(f"{(j.get('id') or ''):<40} {job_lane(j):<4} {(j.get('status') or ''):<12} "\n                     f"{(j.get('machine') or ''):<8} {(j.get('claimed_by') or '-'):<10} "\n                     f"{_elapsed(j):<8} {(j.get('depends_on') or '-'):<12} "\n                     f"{prog}")\n'''
          new = '''        lines.append(f"{(j.get('id') or ''):<40} {job_lane(j):<4} {(j.get('status') or ''):<12} "\n                     f"{(j.get('machine') or ''):<8} {sourcedisplay.source_state(j):<27} "\n                     f"{(j.get('claimed_by') or '-'):<10} {_elapsed(j):<8} "\n                     f"{(j.get('depends_on') or '-'):<12} {prog}")\n'''
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          path.write_text(text)

          # Structured inspect output
          path = Path('src/ablator/external.py')
          text = path.read_text()
          old = 'from .identity import package_source_sha256\nfrom .queue import Queue\n'
          new = 'from .identity import package_source_sha256\nfrom .queue import Queue\nfrom . import source_display as sourcedisplay\n'
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          old = '''        "health": record.get("health"),\n        "terminal": str(record.get("status")) in TERMINAL_STATES,\n'''
          new = '''        "health": record.get("health"),\n        **sourcedisplay.inspect_fields(record),\n        "terminal": str(record.get("status")) in TERMINAL_STATES,\n'''
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          path.write_text(text)

          # TUI selected-run detail
          path = Path('src/ablator/tui/app.py')
          text = path.read_text()
          old = '''            job_id, _, _, machine, *_ = row\n            mcfg = cfgmod.machine_cfg(cfg, machine)\n            detail = self.query_one("#pod_detail", Static)\n            if mcfg.get("backend") != "k8s":\n                detail.update(f"{job_id}: bare-metal job on {machine} "\n                             "(no pod status to show)")\n                return\n'''
          new = '''            job_id, _, _, machine, *_ = row\n            mcfg = cfgmod.machine_cfg(cfg, machine)\n            detail = self.query_one("#pod_detail", Static)\n            job = next((j for j in qvmod.load_jobs(cfg) if j.get("id") == job_id), {})\n            source_line = qvmod.source_detail(job)\n            if mcfg.get("backend") != "k8s":\n                detail.update(f"{source_line}\\n{job_id}: bare-metal job on {machine} "\n                             "(no pod status to show)")\n                return\n'''
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          old = '''            detail.update(f"{job_id} pod: {status_line}\\n\\n{tail}")\n'''
          new = '''            detail.update(f"{source_line}\\n{job_id} pod: {status_line}\\n\\n{tail}")\n'''
          if new not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python -m compileall -q src/ablator
          git diff --check
      - name: Run full test suite
        run: |
          git config --global user.name "Ablator CI"
          git config --global user.email "ablator-ci@users.noreply.github.com"
          python -m pip install -e . pytest
          pytest -q
      - name: Commit UX integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ablator/cli.py src/ablator/external.py src/ablator/tui/app.py
          git commit -m 'feat(#32): expose Git target and execution provenance'
          git push origin HEAD:agent/issue-32-source-provenance-ux
