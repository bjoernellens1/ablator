name: Apply process-start runner identity
on:
  push:
    branches: [fix/runner-source-fingerprint]
    paths: ['.github/workflows/apply-process-identity.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runner-source-fingerprint
      - name: Capture source identity once per process
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/ablator/external.py')
          text=path.read_text()
          marker='''TERMINAL_STATES = frozenset(\n    {"done", "failed", "quarantined", "cancelled", "failed_no_retry"}\n)\n\n\nclass ExternalJobError'''
          replacement='''TERMINAL_STATES = frozenset(\n    {"done", "failed", "quarantined", "cancelled", "failed_no_retry"}\n)\n# Identity of the source tree loaded by this Ablator process. Computing this\n# once at import/startup is both cheaper than hashing on every claim and more\n# semantically correct if the checkout is later edited without restarting the\n# already-running process.\n_PROCESS_SOURCE_SHA256 = package_source_sha256(Path(__file__).resolve().parent)\n\n\nclass ExternalJobError'''
          assert marker in text
          text=text.replace(marker,replacement,1)
          old='source_sha256 = package_source_sha256(module_path.parent)'
          assert old in text
          text=text.replace(old,'source_sha256 = _PROCESS_SOURCE_SHA256',1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ablator/external.py
          git commit -m 'Capture runner source fingerprint once per process'
          git push origin HEAD:fix/runner-source-fingerprint
