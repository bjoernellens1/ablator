name: Agent retry pinned policy integration

on:
  push:
    branches: [agent/issues-29-30-pinned-policy-remote]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-29-30-pinned-policy-remote
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reapply exact generated patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-patch-pinned-policy.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)
          exec(compile(script, '<pinned-policy-patch>', 'exec'))
          PY
          python -m compileall -q src/ablator
          git diff --check
      - name: Run full test suite
        run: |
          git config --global user.name "Ablator CI"
          git config --global user.email "ablator-ci@users.noreply.github.com"
          python -m pip install -e . pytest
          pytest -q
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ablator/queue.py src/ablator/runner.py src/ablator/source_checkout.py
          git commit -m 'fix(#29,#30): make pinned jobs independent of mutable checkout drift'
          git push origin HEAD:agent/issues-29-30-pinned-policy-remote
